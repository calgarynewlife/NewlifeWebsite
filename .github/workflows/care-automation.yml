name: 关怀探访自动任务

on:
  schedule:
    # 每天 15:00 UTC（卡加利 MST 上午8点 / MDT 上午9点）
    # 脚本按本地星期判断：周三分配、周五升级、每天检查达标与失联
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: '手动运行：auto(按星期) / assign / escalate / daily / all'
        required: false
        default: 'auto'

permissions:
  contents: read
  id-token: write          # 必须：用于向 Google 换取 OIDC 令牌（无密钥认证）

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 无密钥认证：Workload Identity Federation
      - name: 认证到 Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装依赖
        working-directory: care-app/automation
        run: npm install --no-audit --no-fund
      - name: 运行自动任务
        working-directory: care-app/automation
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_TASK: ${{ github.event.inputs.task || 'auto' }}
        run: node run.js
